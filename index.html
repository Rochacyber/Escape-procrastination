<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape procrastination</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Escape da procrastinação</h1>
        
    <p class="descricao">
         Você consegue ficar 25 minutos sem abrir as redes sociais?
    </p>

    <p id="timer">00:00</p>
    <p id="mensagem">sua jornada começa agora!</p>
 
<button id="botao-desafio">
    ACEITAR DESAFIO
</button>

      </div>

     <div id="modal" class="modal escondido">
        <div class="modal-conteudo">
            <h2>Parabéns, você conseguiu! 🎉</h2>
            <p>Caso queira dar um tempo das redes sociais novamente, já sabe, né?</p>
            <button id="botao-finalizar">FINALIZAR</button>
        </div>
    </div>


<script src="script.js"></script>
   
</body>
</html>
